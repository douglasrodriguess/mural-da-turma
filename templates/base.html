<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural da Turma</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f2f4f8; color: #1f2937; }
    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: .8rem 1.25rem; display: flex; align-items: center; }
    nav .logo { font-weight: 700; color: #4f46e5; text-decoration: none; font-size: 1.1rem; margin-right: auto; }
    nav a, nav span { margin-left: 1rem; color: #4b5563; text-decoration: none; font-size: .95rem; }
    nav a:hover { color: #4f46e5; }
    main { max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
    .caixa { background: #fff; border-radius: 12px; padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 1.5rem; }
    .aviso { background: #eef2ff; color: #3730a3; padding: .7rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    form { display: grid; gap: .7rem; }
    input, textarea { font: inherit; padding: .65rem .8rem; border: 1px solid #d1d5db; border-radius: 8px; width: 100%; }
    textarea { resize: vertical; }
    button { font: inherit; background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: .65rem 1rem; cursor: pointer; }
    button:hover { background: #4338ca; }
    h2 { margin: 0 0 1rem; font-size: 1.15rem; }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="{{ url_for('index') }}"> Mural da Turma</a>
    {% if current_user.is_authenticated %}
      <span>Olá, {{ current_user.nome }}</span>
      <a href="{{ url_for('logout') }}">Sair</a>
    {% else %}
      <a href="{{ url_for('login') }}">Entrar</a>
      <a href="{{ url_for('cadastro') }}">Cadastrar</a>
    {% endif %}
  </nav>

  <main>
    {% for msg in get_flashed_messages() %}
      <div class="aviso">{{ msg }}</div>
    {% endfor %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
