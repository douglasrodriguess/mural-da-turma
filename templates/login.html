{% extends "base.html" %}

{% block conteudo %}
  <h2>Entrar</h2>
  <form method="post">
    <input name="email" type="email" placeholder="E-mail" required>
    <input name="senha" type="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>
  <p>Não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
{% endblock %}
